name: CI Pipeline

on:
  push:
    branches:
      - main
      - feat/*
      - infra/*
      - ci/*
      - ops/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          PYTHONPATH=. pytest -v app/tests

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Lint Comments API Chart
        run: |
          helm lint helm/comments-api
          helm template test helm/comments-api > /dev/null

  trivy-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local Docker image
        run: |
          docker build -t comments-api:scan ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "comments-api:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  checkov-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: infra/terraform
          soft_fail: true
          output_format: cli
